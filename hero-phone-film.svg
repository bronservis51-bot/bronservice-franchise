<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1800" role="img" aria-labelledby="t d">
  <title id="t">Дизайн-плёнка Бронь Сервис</title>
  <desc id="d">Тёмная декоративная плёнка с синими световыми дугами и русскими подписями.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1425"/>
      <stop offset="38%" stop-color="#182c59"/>
      <stop offset="70%" stop-color="#09111f"/>
      <stop offset="100%" stop-color="#040609"/>
    </linearGradient>
    <radialGradient id="glow1" cx="28%" cy="18%" r="70%">
      <stop offset="0%" stop-color="#8ca8ff" stop-opacity="0.58"/>
      <stop offset="42%" stop-color="#4468d0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#4468d0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#d5ddff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#5176de" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#5176de" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
