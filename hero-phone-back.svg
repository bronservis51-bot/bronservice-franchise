    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff2b3"/>
      <stop offset="100%" stop-color="#e0bf4d"/>
    </radialGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="28" stdDeviation="34" flood-color="#000000" flood-opacity="0.34"/></filter>
    <filter id="inner"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>

  <rect width="900" height="1800" rx="120" fill="url(#body)"/>
