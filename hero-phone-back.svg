<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1800" role="img" aria-labelledby="t d">
  <title id="t">Смартфон с дизайн-плёнкой на задней панели</title>
  <desc id="d">Тёмно-синий смартфон, вид сзади, с декоративной плёнкой в фирменной эстетике Бронь Сервис.</desc>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17305f"/>
